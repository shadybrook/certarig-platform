openapi: 3.0.3
info:
  title: CertaRig Edge API
  version: 0.4.0
  description: Deterministic kernel, procedures, approvals, evidence. Generated from
    the live route table.
paths:
  /health:
    get:
      summary: GET /health
      responses:
        '200':
          description: Success
  /v1/errors:
    get:
      summary: GET /v1/errors
      responses:
        '200':
          description: Success
  /v1/auth/session:
    post:
      summary: POST /v1/auth/session
      responses:
        '200':
          description: Success
  /v1/rig:
    get:
      summary: GET /v1/rig
      responses:
        '200':
          description: Success
  /v1/rig/propose:
    post:
      summary: POST /v1/rig/propose
      responses:
        '200':
          description: Success
      description: Validate proposed configuration and return semantic revalidation
        requirements. Rig-level/unclassified changes require full qualification.
  /v1/rig/apply:
    post:
      summary: POST /v1/rig/apply
      responses:
        '200':
          description: Success
      description: Operator-only application with expected_current_hash. When supplying
        interview_id also supply interview_revision; the proposed document must match
        exactly. Material changes invalidate approvals/reviews and preserve configuration
        history.
  /v1/capabilities/propose:
    post:
      summary: POST /v1/capabilities/propose
      responses:
        '200':
          description: Success
  /v1/capabilities/apply:
    post:
      summary: POST /v1/capabilities/apply
      responses:
        '200':
          description: Success
  /v1/ledger:
    get:
      summary: GET /v1/ledger
      responses:
        '200':
          description: Success
  /v1/authoring/templates:
    get:
      summary: GET /v1/authoring/templates
      responses:
        '200':
          description: Success
  /v1/authoring/build:
    post:
      summary: POST /v1/authoring/build
      responses:
        '200':
          description: Success
  /v1/ops/acknowledge_unclean:
    post:
      summary: POST /v1/ops/acknowledge_unclean
      responses:
        '200':
          description: Success
  /v1/signals:
    get:
      summary: GET /v1/signals
      responses:
        '200':
          description: Success
  /v1/capabilities:
    get:
      summary: GET /v1/capabilities
      responses:
        '200':
          description: Success
  /v1/live/state:
    get:
      summary: GET /v1/live/state
      responses:
        '200':
          description: Success
  /v1/live/recordings/latest.csv:
    get:
      summary: GET /v1/live/recordings/latest.csv
      responses:
        '200':
          description: Success
  /v1/audit:
    get:
      summary: GET /v1/audit
      responses:
        '200':
          description: Success
  /v1/live/commands/safe:
    post:
      summary: POST /v1/live/commands/safe
      responses:
        '200':
          description: Success
  /v1/live/commands/reset:
    post:
      summary: POST /v1/live/commands/reset
      responses:
        '200':
          description: Success
  /v1/live/commands/permit:
    post:
      summary: POST /v1/live/commands/permit
      responses:
        '200':
          description: Success
  /v1/live/recordings/start:
    post:
      summary: POST /v1/live/recordings/start
      responses:
        '200':
          description: Success
  /v1/live/recordings/stop:
    post:
      summary: POST /v1/live/recordings/stop
      responses:
        '200':
          description: Success
  /v1/approvals:
    get:
      summary: GET /v1/approvals
      responses:
        '200':
          description: Success
  /v1/approvals/{approval_id}:
    get:
      summary: GET /v1/approvals/{approval_id}
      responses:
        '200':
          description: Success
  /v1/approvals/request:
    post:
      summary: POST /v1/approvals/request
      responses:
        '200':
          description: Success
  /v1/approvals/{approval_id}/grant:
    post:
      summary: POST /v1/approvals/{approval_id}/grant
      responses:
        '200':
          description: Success
  /v1/approvals/{approval_id}/deny:
    post:
      summary: POST /v1/approvals/{approval_id}/deny
      responses:
        '200':
          description: Success
  /v1/procedures:
    get:
      summary: GET /v1/procedures
      responses:
        '200':
          description: Success
  /v1/procedures/drafts:
    get:
      summary: GET /v1/procedures/drafts
      responses:
        '200':
          description: Success
    post:
      summary: POST /v1/procedures/drafts
      responses:
        '200':
          description: Success
  /v1/procedures/drafts/{procedure_hash}:
    get:
      summary: GET /v1/procedures/drafts/{procedure_hash}
      responses:
        '200':
          description: Success
  /v1/procedures/{procedure_id}:
    get:
      summary: GET /v1/procedures/{procedure_id}
      responses:
        '200':
          description: Success
  /v1/procedures/validate:
    post:
      summary: POST /v1/procedures/validate
      responses:
        '200':
          description: Success
  /v1/procedures/drafts/{procedure_hash}/approve:
    post:
      summary: POST /v1/procedures/drafts/{procedure_hash}/approve
      responses:
        '200':
          description: Success
  /v1/procedures/drafts/{procedure_hash}/reject:
    post:
      summary: POST /v1/procedures/drafts/{procedure_hash}/reject
      responses:
        '200':
          description: Success
  /v1/procedure_runs:
    get:
      summary: GET /v1/procedure_runs
      responses:
        '200':
          description: Success
    post:
      summary: POST /v1/procedure_runs
      responses:
        '201':
          description: Run started
        '403':
          description: Invalid, expired, mismatched or reused approval
        '409':
          description: Readiness or contract prevents start
        '428':
          description: Request human approval, then retry with approval_id
      description: Start a named approved procedure. commissioning_required profiles
        require a single-use approval for every principal. Approval binds requester
        role/name, exact args, contract, adapter and procedure hash.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - procedure_id
              properties:
                procedure_id:
                  type: string
                label:
                  type: string
                approval_id:
                  type: string
  /v1/procedure_runs/{run_id}:
    get:
      summary: GET /v1/procedure_runs/{run_id}
      responses:
        '200':
          description: Success
  /v1/procedure_runs/{run_id}/ack:
    post:
      summary: POST /v1/procedure_runs/{run_id}/ack
      responses:
        '200':
          description: Success
  /v1/procedure_runs/{run_id}/abort:
    post:
      summary: POST /v1/procedure_runs/{run_id}/abort
      responses:
        '200':
          description: Success
  /v1/evidence:
    get:
      summary: GET /v1/evidence
      responses:
        '200':
          description: Success
  /v1/evidence/runs/{run_id}:
    get:
      summary: GET /v1/evidence/runs/{run_id}
      responses:
        '200':
          description: Success
  /v1/evidence/runs/{run_id}/files/{name}:
    get:
      summary: GET /v1/evidence/runs/{run_id}/files/{name}
      responses:
        '200':
          description: Success
  /v1/evidence/recordings/{name}:
    get:
      summary: GET /v1/evidence/recordings/{name}
      responses:
        '200':
          description: Success
  /v1/evidence/exports/{name}:
    get:
      summary: GET /v1/evidence/exports/{name}
      responses:
        '200':
          description: Success
  /v1/ops/briefing:
    get:
      summary: GET /v1/ops/briefing
      responses:
        '200':
          description: Success
    post:
      summary: POST /v1/ops/briefing
      responses:
        '200':
          description: Success
  /v1/ops/recorder/stop:
    post:
      summary: POST /v1/ops/recorder/stop
      responses:
        '200':
          description: Success
  /v1/ops/evidence/export:
    post:
      summary: POST /v1/ops/evidence/export
      responses:
        '200':
          description: Success
  /v1/ops/shutdown:
    post:
      summary: POST /v1/ops/shutdown
      responses:
        '200':
          description: Success
  /v1/agent/chat:
    post:
      summary: POST /v1/agent/chat
      responses:
        '200':
          description: Success
  /v1/agent/sessions/{session_id}:
    get:
      summary: GET /v1/agent/sessions/{session_id}
      responses:
        '200':
          description: Success
  /v1/commissioning:
    get:
      summary: GET /v1/commissioning
      responses:
        '200':
          description: Success
      description: Read readiness, blockers, evidence kind and current versioned commissioning
        record; optional procedure_id query selects one procedure.
  /v1/commissioning/review:
    post:
      summary: POST /v1/commissioning/review
      responses:
        '201':
          description: Reviewed simulator configuration
        '403':
          description: Operator required
        '409':
          description: Stale configuration, invalid observations or physical acceptance
            required
      description: Operator-only review bound to current config, adapter and approved
        procedure revisions. Simulator readiness does not accept physical commissioning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_config_hash
              - procedure_ids
              properties:
                expected_config_hash:
                  type: string
                procedure_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
  /v1/commissioning/physical:
    post:
      summary: POST /v1/commissioning/physical
      responses:
        '201':
          description: Review retained with readiness
        '403':
          description: Human operator required
        '409':
          description: Missing, stale or incompatible qualification
      description: Operator-attested observation, attended trial or acceptance of
        a specific Pi configuration/wiring revision. Requires hashed physical qualification
        records and their raw artifacts. Trials expire after 30 minutes and on restart.
        Accepted procedures require passing physical trials. Not safety certification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stage
              - expected_config_hash
              - wiring_revision
              - procedure_ids
              - attest_reviewed
              - checks
              properties:
                stage:
                  enum:
                  - observation
                  - trial
                  - accepted
                expected_config_hash:
                  type: string
                wiring_revision:
                  type: string
                procedure_ids:
                  type: array
                  items:
                    type: string
                attest_reviewed:
                  type: boolean
                checks:
                  type: object
                  description: Named checks mapped to local path and SHA-256. JSON
                    records must include exact config/wiring identity, passed=true,
                    evidence_kind=physical and raw artifact references.
  /v1/commissioning/templates:
    get:
      summary: GET /v1/commissioning/templates
      responses:
        '200':
          description: Success
  /v1/commissioning/interviews:
    get:
      summary: GET /v1/commissioning/interviews
      responses:
        '200':
          description: Success
      description: List persisted drafts. Sources are operator-provided references;
        fixture interpretation is deterministic.
    post:
      summary: POST /v1/commissioning/interviews
      responses:
        '201':
          description: Inert interview draft created
  /v1/commissioning/interviews/{interview_id}:
    get:
      summary: GET /v1/commissioning/interviews/{interview_id}
      responses:
        '200':
          description: Success
    patch:
      summary: PATCH /v1/commissioning/interviews/{interview_id}
      responses: &id001
        '200':
          description: Draft saved
        '409':
          description: Stale interview revision
      description: Save answers with optimistic revision matching. Unrecognized text
        remains unresolved. Does not change active configuration.
      requestBody: &id002
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_revision
              properties:
                expected_revision:
                  type: integer
                answers:
                  type: object
                sources:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 1
                text:
                  type: string
  /v1/commissioning/interviews/{interview_id}/answers:
    post:
      summary: POST /v1/commissioning/interviews/{interview_id}/answers
      responses: *id001
      description: Save answers with optimistic revision matching. Unrecognized text
        remains unresolved. Does not change active configuration.
      requestBody: *id002
  /v1/commissioning/interviews/{interview_id}/propose:
    post:
      summary: POST /v1/commissioning/interviews/{interview_id}/propose
      responses:
        '200':
          description: Success
      description: Validate sources, units, calibration and supported procedures.
        Returns needs_evidence with blockers or proposed with a configuration diff
        and revalidation checklist. Never applies configuration.
