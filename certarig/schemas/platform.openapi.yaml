openapi: 3.1.0
info:
  title: CertaRig local customer-agent control plane
  version: 0.5.0
  description: Loopback simulator proof. Separate from Edge role keys; no physical
    or hosted authority.
servers:
- url: http://127.0.0.1:18090
security:
- applicationSession: []
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: certarig_session
  schemas:
    Organization:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    Membership:
      type: object
      required:
      - user_id
      - org_id
      - role
      - enabled
      properties:
        user_id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        role:
          enum:
          - author
          - reviewer
        enabled:
          type: boolean
    AssetGrant:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - user_id
      - enabled
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        enabled:
          type: boolean
    AgentVersion:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - author_id
      - agent_id
      - revision
      - name
      - instructions
      - connection_id
      - tools
      - output_contract
      - limits
      - hash
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        author_id:
          type: string
          minLength: 1
        agent_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
        instructions:
          type: string
          minLength: 1
        connection_id:
          type: string
          minLength: 1
        tools:
          type: array
          items:
            type: string
        output_contract:
          type: object
        limits:
          type: object
        hash:
          type: string
          minLength: 1
    Evaluation:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - version_id
      - binding
      - status
      - trusted
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        binding:
          type: object
        status:
          enum:
          - collecting
          - awaiting_sandbox
          - passed
          - failed
          - interrupted
        trusted:
          type: boolean
    Deployment:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - version_id
      - evaluation_id
      - author_id
      - reviewer_id
      - binding
      - mode
      - status
      - assessments
      - observations
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        evaluation_id:
          type: string
          minLength: 1
        author_id:
          type: string
          minLength: 1
        reviewer_id:
          type: string
          minLength: 1
        binding:
          type: object
        mode:
          const: observation
        status:
          enum:
          - approved
          - running
          - paused
          - revoked
          - interrupted
          - completed
        assessments:
          type: integer
          minimum: 0
        observations:
          type: array
          items:
            type: object
        provider_status:
          enum:
          - not_started
          - idle
          - connecting
          - assessing
          - using_tool
          - completed
          - stopped
          - cancelled
          - interrupted
          - error
        activity:
          type: string
        runtime_health:
          $ref: '#/components/schemas/RuntimeHealth'
    AgentDefinition:
      type: object
      required:
      - name
      - instructions
      - asset_id
      - connection_id
      - tools
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          minLength: 1
          maxLength: 8000
        asset_id: &id001
          type: string
          minLength: 1
        connection_id: *id001
        tools:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - read_capabilities
            - read_evidence
            - read_procedure_run
            - read_procedures
            - read_rig
            - read_signals
            - read_state
    ModelConnectionInput:
      type: object
      required:
      - backend
      - model
      additionalProperties: false
      properties:
        backend:
          enum:
          - codex
          - fixture
        model:
          type: string
          minLength: 1
          maxLength: 120
        consent:
          type: boolean
    ObservationOutput:
      type: object
      properties:
        status:
          enum:
          - ready
          - blocked
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - status
      - reason
      additionalProperties: false
    RuntimeHealth:
      type: object
      required:
      - state
      - heartbeat_at
      properties:
        state:
          enum:
          - online
          - offline
          - unresponsive
          - unavailable
        runtime_id:
          type:
          - string
          - 'null'
        heartbeat_at:
          type:
          - number
          - 'null'
        timeout_s:
          type: number
          const: 5
    ProfileRevision:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - revision
      - profile_hash
      - profile
      - reviewer_id
      - reviewed_at
      - record_hash
      properties:
        id: &id002
          type: string
          minLength: 1
        org_id: *id002
        asset_id: *id002
        profile_hash: *id002
        reviewer_id: *id002
        record_hash: *id002
        revision:
          type: integer
          minimum: 1
        capabilities_hash:
          type:
          - string
          - 'null'
        profile:
          type: object
        reviewed_at:
          type: number
    ProfileReview:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - reviewer_id
      - base_revision
      - base_hash
      - profile_hash
      - profile
      - capabilities_hash
      - status
      - changed
      - diff
      - revalidation
      - expires_at
      properties:
        id: *id002
        org_id: *id002
        asset_id: *id002
        reviewer_id: *id002
        base_hash: *id002
        profile_hash: *id002
        capabilities_hash: *id002
        base_revision:
          type: integer
          minimum: 1
        profile:
          type: object
        status:
          enum:
          - pending
          - unchanged
          - accepted
        changed:
          type: boolean
        diff:
          type: array
          items: *id002
        revalidation:
          type: object
        expires_at:
          type: number
paths:
  /v1/auth/login:
    get:
      summary: Begin OIDC Authorization Code with S256 PKCE, state and nonce
      responses:
        '302':
          description: Redirect to issuer or Studio
        '401':
          description: Invalid login
      security: []
  /v1/auth/callback:
    get:
      summary: Verify issuer, audience, signature, expiry and nonce; create application
        session
      responses:
        '302':
          description: Redirect to issuer or Studio
        '401':
          description: Invalid login
      security: []
      parameters:
      - in: query
        name: state
        required: true
        schema: *id001
      - in: query
        name: code
        required: true
        schema: *id001
  /v1/auth/me:
    get:
      summary: Current server-derived membership and CSRF token
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/auth/logout:
    post:
      summary: End application session; deployment lease remains separate
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/auth/members:
    get:
      summary: Reviewer-only member identifiers
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/assets:
    get:
      summary: List granted assets only
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/assets/pair:
    post:
      summary: Reviewer creates five-minute single-use connector pairing code
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connector
              properties:
                connector: *id001
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/assets/enroll:
    post:
      summary: Reviewer enrolls registered local simulator only
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code: *id001
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/assets/{asset_id}/grants:
    post:
      summary: Reviewer changes user_id and enabled grant; removal pauses deployment
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - enabled
              properties:
                user_id: *id001
                enabled:
                  type: boolean
      parameters:
      - in: path
        name: asset_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/model-connections:
    get:
      summary: List this user's private connection metadata
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
    post:
      summary: Create model/backend and explicit deployment consent
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConnectionInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/model-connections/{connection_id}/login:
    post:
      summary: Begin dedicated managed ChatGPT device sign-in
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: connection_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/model-connections/{connection_id}/status:
    post:
      summary: Read redacted account connection state
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: connection_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/model-connections/{connection_id}/disconnect:
    post:
      summary: Remove consent and pause affected deployments
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: connection_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/agents:
    get:
      summary: List versions accessible through asset grants
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
    post:
      summary: Create immutable first version
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinition'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/agents/{agent_id}/versions:
    post:
      summary: Author creates new immutable version
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinition'
      parameters:
      - in: path
        name: agent_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/agents/{version_id}/evaluate:
    post:
      summary: Collect five cases outside Edge with synthetic tool data; not qualification
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: version_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/agents/evaluations:
    get:
      summary: List scoped evaluation records
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/agents/evaluations/{evaluation_id}:
    get:
      summary: Read scoped evaluation trace and receipt
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      parameters:
      - in: path
        name: evaluation_id
        required: true
        schema: *id001
    post:
      summary: Author verifies stored traces in qualified Sandbox; submitted pass
        reports are ignored
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: evaluation_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/agents/preflight:
    get:
      summary: Report Sandbox resource and qualification blockers
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/deployments:
    get:
      summary: List scoped deployment records
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/deployments/review:
    post:
      summary: Independent Reviewer binds version_id and evaluation_id to observation
        permissions
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version_id
              - evaluation_id
              properties:
                version_id: *id001
                evaluation_id: *id001
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/deployments/{deployment_id}:
    get:
      summary: Read scoped observations and lease
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema: *id001
  /v1/deployments/{deployment_id}/start:
    post:
      summary: Reviewer starts bounded observation lease; separate runtime required
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/deployments/{deployment_id}/revoke:
    post:
      summary: Author or Reviewer revokes tools and discards late results
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema: *id001
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id001
  /v1/deployments/{deployment_id}/events:
    get:
      summary: Read lifecycle audit events
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema: *id001
  /v1/deployments/{deployment_id}/export:
    get:
      summary: Download complete offline-verifiable lifecycle ZIP
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      parameters:
      - in: path
        name: deployment_id
        required: true
        schema: *id001
  /v1/openapi.json:
    get:
      summary: Read the customer control-plane API contract
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/assets/{asset_id}/rig:
    get:
      summary: Scoped connector observation; credentials remain server-side
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      parameters:
      - in: path
        name: asset_id
        required: true
        schema: *id001
  /v1/assets/{asset_id}/signals:
    get:
      summary: Scoped connector observation; credentials remain server-side
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
