openapi: 3.1.0
info:
  title: CertaRig local customer-agent control plane
  version: 0.7.0
  description: 'Local Innovator Workbench: scoped observation agents, reviewed teams
    and isolated analysis. No physical actuation or hosted authority.'
servers:
- url: http://127.0.0.1:18090
security:
- applicationSession: []
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: certarig_session
  schemas:
    Organization:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    Membership:
      type: object
      required:
      - user_id
      - org_id
      - role
      - enabled
      properties:
        user_id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        role:
          enum:
          - author
          - reviewer
        enabled:
          type: boolean
    AssetGrant:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - user_id
      - enabled
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        enabled:
          type: boolean
    AgentVersion:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - author_id
      - agent_id
      - revision
      - name
      - instructions
      - connection_id
      - tools
      - output_contract
      - limits
      - hash
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        author_id:
          type: string
          minLength: 1
        agent_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
        instructions:
          type: string
          minLength: 1
        connection_id:
          type: string
          minLength: 1
        tools:
          type: array
          items:
            type: string
        output_contract:
          type: object
        limits:
          type: object
        hash:
          type: string
          minLength: 1
    Evaluation:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - version_id
      - binding
      - status
      - trusted
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        binding:
          type: object
        status:
          enum:
          - collecting
          - awaiting_sandbox
          - passed
          - failed
          - interrupted
        trusted:
          type: boolean
    Deployment:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - version_id
      - evaluation_id
      - author_id
      - reviewer_id
      - binding
      - mode
      - status
      - assessments
      - observations
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        evaluation_id:
          type: string
          minLength: 1
        author_id:
          type: string
          minLength: 1
        reviewer_id:
          type: string
          minLength: 1
        binding:
          type: object
        mode:
          const: observation
        status:
          enum:
          - approved
          - running
          - paused
          - revoked
          - interrupted
          - completed
        assessments:
          type: integer
          minimum: 0
        observations:
          type: array
          items:
            type: object
        provider_status:
          enum:
          - not_started
          - idle
          - connecting
          - assessing
          - using_tool
          - completed
          - stopped
          - cancelled
          - interrupted
          - error
        activity:
          type: string
        runtime_health:
          $ref: '#/$defs/RuntimeHealth'
    AgentDefinition:
      type: object
      required:
      - name
      - instructions
      - asset_id
      - connection_id
      - tools
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        instructions:
          type: string
          minLength: 1
          maxLength: 8000
        asset_id:
          type: string
          minLength: 1
        connection_id:
          type: string
          minLength: 1
        tools:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - read_capabilities
            - read_evidence
            - read_procedure_run
            - read_procedures
            - read_rig
            - read_signals
            - read_state
    ModelConnectionInput:
      type: object
      required:
      - backend
      - model
      additionalProperties: false
      properties:
        backend:
          enum:
          - codex
          - fixture
        model:
          type: string
          minLength: 1
          maxLength: 120
        consent:
          type: boolean
    ObservationOutput:
      type: object
      properties:
        status:
          enum:
          - ready
          - blocked
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - status
      - reason
      additionalProperties: false
    RuntimeHealth:
      type: object
      required:
      - state
      - heartbeat_at
      properties:
        state:
          enum:
          - online
          - offline
          - unresponsive
          - unavailable
        runtime_id:
          type:
          - string
          - 'null'
        heartbeat_at:
          type:
          - number
          - 'null'
        timeout_s:
          type: number
          const: 5
    ProfileRevision:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - revision
      - profile_hash
      - profile
      - reviewer_id
      - reviewed_at
      - record_hash
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        profile_hash:
          type: string
          minLength: 1
        reviewer_id:
          type: string
          minLength: 1
        record_hash:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        capabilities_hash:
          type:
          - string
          - 'null'
        profile:
          type: object
        reviewed_at:
          type: number
    ProfileReview:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - reviewer_id
      - base_revision
      - base_hash
      - profile_hash
      - profile
      - capabilities_hash
      - status
      - changed
      - diff
      - revalidation
      - expires_at
      properties:
        id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        asset_id:
          type: string
          minLength: 1
        reviewer_id:
          type: string
          minLength: 1
        base_hash:
          type: string
          minLength: 1
        profile_hash:
          type: string
          minLength: 1
        capabilities_hash:
          type: string
          minLength: 1
        base_revision:
          type: integer
          minimum: 1
        profile:
          type: object
        status:
          enum:
          - pending
          - unchanged
          - accepted
        changed:
          type: boolean
        diff:
          type: array
          items:
            type: string
            minLength: 1
        revalidation:
          type: object
        expires_at:
          type: number
    Project:
      type: object
      required:
      - id
      - org_id
      - name
      - owner_id
      - asset_ids
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        asset_ids:
          type: array
          items:
            type: string
    CommissioningDraft:
      type: object
      required:
      - id
      - org_id
      - owner_id
      - asset_id
      - revision
      - status
      - definition
      - messages
      properties:
        id:
          type: string
        org_id:
          type: string
        owner_id:
          type: string
        asset_id:
          type: string
        revision:
          type: integer
          minimum: 1
        status:
          enum:
          - draft
          - committed
        definition:
          type: object
        messages:
          type: array
          items:
            type: object
    Task:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - owner_id
      - kind
      - target_id
      - status
      properties:
        id:
          type: string
        org_id:
          type: string
        asset_id:
          type: string
        owner_id:
          type: string
        kind:
          enum:
          - evaluate
          - qualify
          - team_evaluate
        target_id:
          type: string
        status:
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
          - interrupted
    TeamVersion:
      type: object
      required:
      - id
      - org_id
      - team_members
      - member_evaluations
      - hash
      properties:
        id:
          type: string
        org_id:
          type: string
        team_members:
          type: array
          minItems: 2
          maxItems: 4
          uniqueItems: true
          items:
            type: string
        member_evaluations:
          type: array
          items:
            type: string
        hash:
          type: string
    AnalysisTool:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - source
      - kind
      - hash
      - status
      - input_schema
      - output_schema
      - tests
      properties:
        id:
          type: string
        org_id:
          type: string
        asset_id:
          type: string
        source:
          type: string
          maxLength: 128000
        kind:
          enum:
          - python
          - spice
        hash:
          type: string
        status:
          enum:
          - unreviewed
          - reviewed
        input_schema:
          type: object
        output_schema:
          type: object
        tests:
          type: array
          minItems: 1
          maxItems: 3
    Analysis:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - owner_id
      - tool_id
      - tool_hash
      - status
      properties:
        id:
          type: string
        org_id:
          type: string
        asset_id:
          type: string
        owner_id:
          type: string
        tool_id:
          type: string
        tool_hash:
          type: string
        status:
          type: string
    ConnectorProfile:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - owner_id
      - transport
      - channels
      - status
      properties:
        id:
          type: string
        org_id:
          type: string
        asset_id:
          type: string
        owner_id:
          type: string
        transport:
          enum:
          - mqtt
          - serial_jsonl
          - modbus_tcp
        channels:
          type: array
          minItems: 1
          maxItems: 16
        status:
          enum:
          - proposed
          - reviewed_for_operator_installation
    Replay:
      type: object
      required:
      - id
      - org_id
      - asset_id
      - csv
      - sha256
      - kind
      properties:
        id:
          type: string
        org_id:
          type: string
        asset_id:
          type: string
        csv:
          type: string
          maxLength: 512000
        sha256:
          type: string
        kind:
          const: imported_recording_unverified_origin
    BenchDescriptionFacts:
      title: Operator-declared bench description, never an execution grant
      type: object
      additionalProperties: false
      required:
      - title
      - channels
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 8000
        equipment:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 1000
        transport:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
        procedure:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        channels:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required:
            - channel_id
            - quantity
            - unit
            properties:
              channel_id:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: 'null'
              quantity:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: 'null'
              unit:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 64
                - type: 'null'
              calibration_id:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 1000
                - type: 'null'
              source:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 1000
                - type: 'null'
              scaling:
                anyOf:
                - type: object
                  additionalProperties: false
                  required:
                  - gain
                  - offset
                  properties:
                    gain:
                      type: number
                    offset:
                      type: number
                - type: 'null'
              limits:
                anyOf:
                - type: object
                  additionalProperties: false
                  required:
                  - min
                  - max
                  properties:
                    min:
                      type: number
                    max:
                      type: number
                - type: 'null'
              max_age_s:
                anyOf:
                - type: number
                  exclusiveMinimum: 0
                  maximum: 3600
                - type: 'null'
              reference:
                anyOf:
                - enum:
                  - gauge
                  - absolute
                  - differential
                  - unknown
                - type: 'null'
        source_refs:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1000
        unknowns:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1000
        replay_id:
          type: string
          minLength: 1
          maxLength: 128
    BenchDescriptionCreate:
      type: object
      additionalProperties: false
      required:
      - facts
      properties:
        asset_id: &id001
          type:
          - string
          - 'null'
        facts: &id002
          $ref: '#/components/schemas/BenchDescriptionFacts'
    BenchDescriptionRevise:
      type: object
      additionalProperties: false
      required:
      - facts
      - expected_revision
      properties:
        asset_id: *id001
        facts: *id002
        expected_revision:
          type: integer
          minimum: 1
paths:
  /v1/auth/login:
    get:
      summary: Begin OIDC Authorization Code with S256 PKCE, state and nonce
      responses:
        '302':
          description: Redirect to issuer or Studio
        '401':
          description: Invalid login
      security: []
  /v1/auth/callback:
    get:
      summary: Verify issuer, audience, signature, expiry and nonce; create application
        session
      responses:
        '302':
          description: Redirect to issuer or Studio
        '401':
          description: Invalid login
      security: []
      parameters:
      - in: query
        name: state
        required: true
        schema: &id003
          type: string
          minLength: 1
      - in: query
        name: code
        required: true
        schema: *id003
  /v1/auth/me:
    get:
      summary: Current server-derived membership and CSRF token
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/auth/logout:
    post:
      summary: End application session; deployment lease remains separate
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/auth/members:
    get:
      summary: Reviewer-only member identifiers
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/assets:
    get:
      summary: List granted assets only
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
  /v1/assets/pair:
    post:
      summary: Reviewer creates five-minute single-use connector pairing code
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connector
              properties:
                connector: *id003
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/assets/enroll:
    post:
      summary: Reviewer enrolls registered local simulator only
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code: *id003
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/assets/{asset_id}/grants:
    post:
      summary: Reviewer changes user_id and enabled grant; removal pauses deployment
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - enabled
              properties:
                user_id: *id003
                enabled:
                  type: boolean
      parameters:
      - in: path
        name: asset_id
        required: true
        schema: *id003
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/model-connections:
    get:
      summary: List this user's private connection metadata
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
    post:
      summary: Create model/backend and explicit deployment consent
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConnectionInput'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/model-connections/{connection_id}/login:
    post:
      summary: Begin dedicated managed ChatGPT device sign-in
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: connection_id
        required: true
        schema: *id003
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/model-connections/{connection_id}/status:
    post:
      summary: Read redacted account connection state
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: connection_id
        required: true
        schema: *id003
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/model-connections/{connection_id}/disconnect:
    post:
      summary: Remove consent and pause affected deployments
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: path
        name: connection_id
        required: true
        schema: *id003
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/agents:
    get:
      summary: List versions accessible through asset grants
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
    post:
      summary: Create immutable first version
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinition'
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
  /v1/agents/{agent_id}/versions:
    post:
      summary: Author creates new immutable version
      responses:
        '200':
          description: Success
        '401':
          description: No application session
        '403':
          description: Permission or CSRF refusal
        '404':
          description: Resource unavailable in this scope
        '409':
          description: Invalid or stale lifecycle state
        '503':
          description: Local dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinition'
      parameters:
      - in: path
        name: agent_id
        required: true
        schema: *id003
      - in: header
        name: X-CSRF-Token
        required: true
        schema: *id003
