<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120"><text x="45" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#193744">R1 candidate power-stage schematic</text><text x="45" y="93" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#193744">Node names and component values map to the included power netlists; U_CTRL and IC behavior are functional equivalents.</text><rect x="45" y="113" width="1510" height="43" fill="#fff2dd" stroke="#a14728" stroke-width="2"/><text x="62" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a14728">SIMULATION CANDIDATE - bounded models only; no construction, procurement or physical commissioning release</text><text x="45" y="195" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">12 V +/-10%</text><polyline points="45,235 150,235" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="150,235 162,235" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="162" y="223" width="116" height="24" fill="#ffffff" stroke="#193744" stroke-width="2"/><polyline points="278,235 290,235" fill="none" stroke="#193744" stroke-width="2.5"/><text x="153" y="212" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Rsrc 0.3 ohm</text><polyline points="290,235 370,235" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="370" y="192" width="245" height="88" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="386" y="221" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">K0 / Sestop</text><text x="386" y="251" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">NC E-stop / manual arm</text><polyline points="615,235 705,235" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="705" y="192" width="245" height="88" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="721" y="221" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">K1 / Bmaster</text><text x="721" y="251" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Independent permit contact</text><polyline points="950,235 1510,235" fill="none" stroke="#193744" stroke-width="2.5"/><text x="1120" y="215" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#193744">bus</text><text x="45" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#193744">Supply fuse and branch fuses:</text><text x="45" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">selection / I-t curves pending.</text><text x="45" y="347" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Craw = 10 uF; Cbus = 10 uF.</text><text x="45" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">bus bleed = 10 kohm to node 0.</text><circle cx="1060" cy="235" r="4" fill="#193744"/><polyline points="1060,235 1060,315" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="950" y="315" width="220" height="88" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="966" y="344" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">pump surrogate</text><text x="966" y="374" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">20 ohm + 10 mH</text><polyline points="1060,403 1060,465" fill="none" stroke="#193744" stroke-width="2.5"/><circle cx="1060" cy="435" r="4" fill="#193744"/><text x="960" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">pumpdrain</text><rect x="970" y="465" width="180" height="88" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="986" y="494" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">N-MOS switch</text><text x="986" y="524" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">0.10 ohm ON</text><polyline points="1060,553 1060,590" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="970" y="590" width="180" height="72" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="986" y="619" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">0.05 ohm shunt</text><polyline points="1060,662 1060,685" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1060,685 1060,697" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1045,697 1075,697" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1050,703 1070,703" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1056,709 1064,709" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1060,284 895,284 895,416" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="837" y="416" width="116" height="100" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="853" y="445" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">D + Z20</text><text x="853" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#193744">opposed</text><text x="853" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#193744">20 V model</text><polyline points="895,516 965,516 965,435 1060,435" fill="none" stroke="#193744" stroke-width="2.5"/><text x="955" y="745" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#193744">Shunt -&gt; current ADC + OC comparator</text><circle cx="1390" cy="235" r="4" fill="#193744"/><polyline points="1390,235 1390,315" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="1280" y="315" width="220" height="88" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="1296" y="344" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">valve surrogate</text><text x="1296" y="374" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">24 ohm + 200 mH</text><polyline points="1390,403 1390,465" fill="none" stroke="#193744" stroke-width="2.5"/><circle cx="1390" cy="435" r="4" fill="#193744"/><text x="1290" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">valvedrain</text><rect x="1300" y="465" width="180" height="88" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="1316" y="494" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">N-MOS switch</text><text x="1316" y="524" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">0.10 ohm ON</text><polyline points="1390,553 1390,590" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="1300" y="590" width="180" height="72" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="1316" y="619" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">0.05 ohm shunt</text><polyline points="1390,662 1390,685" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1390,685 1390,697" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1375,697 1405,697" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1380,703 1400,703" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1386,709 1394,709" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1390,284 1225,284 1225,416" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="1167" y="416" width="116" height="100" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="1183" y="445" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">D + Z20</text><text x="1183" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#193744">opposed</text><text x="1183" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#193744">20 V model</text><polyline points="1225,516 1295,516 1295,435 1390,435" fill="none" stroke="#193744" stroke-width="2.5"/><text x="1285" y="745" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#193744">Shunt -&gt; current ADC + OC comparator</text><rect x="45" y="430" width="650" height="180" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="61" y="459" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">U_CTRL - behavioral hardware logic</text><text x="61" y="489" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Independent 5 V logic; 3.3 V ADC power-good monitor.</text><text x="61" y="515" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">E-stop / lost power / missing heartbeat clears ARM state.</text><text x="61" y="541" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Fresh reset edge accepted only while permit is LOW.</text><text x="61" y="567" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Watchdog 150-250 ms; relay equivalent delay about 10 ms.</text><rect x="45" y="650" width="650" height="140" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="61" y="679" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Driver and independent overcurrent veto</text><text x="61" y="709" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">5 V driver -&gt; 50 ohm -&gt; 100 ohm -&gt; common gate.</text><text x="61" y="735" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Gate -&gt; 47 kohm and 3 nF to node 0.</text><text x="61" y="761" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Either shunt &gt;0.2 V (~4 A) sets the latched fast gate veto.</text><polyline points="695,710 800,710 800,509 970,509" fill="none" stroke="#147384" stroke-width="2.5"/><polyline points="800,509 800,564 1300,564 1300,509" fill="none" stroke="#147384" stroke-width="2.5"/><rect x="45" y="842" width="1510" height="185" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="61" y="871" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Design requirements exposed by this model</text><text x="61" y="901" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">K0 and K1 are separate physical interruption paths; a welded K1 plus shorted MOSFET is an uncovered combined fault.</text><text x="61" y="927" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">100 V generic avalanche envelope / 70 V design criterion is not a selected MOSFET rating or a verified safe operating area.</text><text x="61" y="953" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Low-side shunts measure switch current, including startup; they do not measure the full recirculating flyback tail.</text><text x="61" y="979" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Source is a Thevenin supply. Real SMPS foldback, fuses, coil-driver transistors, GPIO translation and wiring parasitics remain unmodeled.</text><text x="61" y="1005" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">No motor or valve power may be routed through the preserved Phase 3 indicator/relay circuit.</text><text x="45" y="1090" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536b76">9 November 2026 | ngspice 47 | All voltages relative to model node 0; Pi header allocation remains unfrozen</text><text x="1440" y="1090" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536b76">2 / 4</text></svg>