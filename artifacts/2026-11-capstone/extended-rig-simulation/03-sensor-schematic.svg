<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120"><text x="45" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#193744">R1 candidate sensor interfaces</text><text x="45" y="93" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#193744">Protection topology is electrically simulated. Named commercial devices are candidates, not transistor-level macromodels.</text><rect x="45" y="113" width="1510" height="43" fill="#fff2dd" stroke="#a14728" stroke-width="2"/><text x="62" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a14728">SIMULATION CANDIDATE - bounded models only; no construction, procurement or physical commissioning release</text><text x="45" y="205" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#193744">Pressure current-loop receiver</text><rect x="45" y="235" width="300" height="100" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="61" y="264" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">24 V +/-10% loop</text><text x="61" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Transmitter needs &gt;=10 V</text><text x="61" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Current request 0-50 mA</text><polyline points="345,285 410,285" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="410" y="235" width="260" height="100" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="426" y="264" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Loop protection</text><text x="426" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">33 mA upper bound</text><text x="426" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">25 ohm; reverse blocks</text><polyline points="670,285 730,285" fill="none" stroke="#193744" stroke-width="2.5"/><circle cx="730" cy="285" r="4" fill="#193744"/><polyline points="730,285 730,375" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="650" y="375" width="160" height="80" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="666" y="404" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Rburden</text><text x="666" y="434" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">100 ohm</text><polyline points="730,455 730,467" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="715,467 745,467" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="720,473 740,473" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="726,479 734,479" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="730,285 835,285" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="835,285 847,285" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="847" y="273" width="131" height="24" fill="#ffffff" stroke="#193744" stroke-width="2"/><polyline points="978,285 990,285" fill="none" stroke="#193744" stroke-width="2.5"/><text x="838" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Rseries 10k</text><polyline points="990,285 1030,285" fill="none" stroke="#193744" stroke-width="2.5"/><circle cx="1030" cy="285" r="4" fill="#193744"/><text x="1000" y="260" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">pre</text><rect x="1090" y="235" width="245" height="100" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="1106" y="264" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Power-off isolator</text><text x="1106" y="294" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">ON 4.5 ohm</text><text x="1106" y="320" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">OFF leakage &lt;=2 uA</text><polyline points="1030,285 1090,285" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1335,285 1450,285" fill="none" stroke="#193744" stroke-width="2.5"/><circle cx="1450" cy="285" r="4" fill="#193744"/><text x="1380" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#193744">ADC pin</text><polyline points="1450,285 1450,375" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="1360" y="375" width="180" height="80" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="1376" y="404" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Discharge</text><text x="1376" y="434" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">33k to node 0</text><polyline points="1450,455 1450,467" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1435,467 1465,467" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1440,473 1460,473" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1446,479 1454,479" fill="none" stroke="#193744" stroke-width="2.5"/><polyline points="1030,285 1030,375" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="900" y="375" width="260" height="135" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="916" y="404" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Clamp + filter</text><text x="916" y="434" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193744">10 nF pre -&gt; node 0</text><text x="916" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193744">pre -&gt; diode -&gt; 2.5 V ref</text><text x="916" y="486" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193744">node 0 -&gt; diode -&gt; pre</text><rect x="45" y="540" width="730" height="140" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="61" y="569" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Reference / ADC equivalent</text><text x="61" y="599" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">5 V conditioner -&gt; 1k -&gt; 2.5 V shunt reference.</text><text x="61" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">ADC: 6 Mohm input, 10 pF and supply ESD diodes.</text><text x="61" y="651" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Isolator opens if 3.3 V &lt;3.0 V or conditioner &lt;4.5 V.</text><rect x="815" y="540" width="740" height="140" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="831" y="569" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Calibration consequence</text><text x="831" y="599" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">10k/33k network loads the burden; use end-to-end calibration.</text><text x="831" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Modeled 4 mA -&gt; 0.305839 V; 20 mA -&gt; 1.529191 V.</text><text x="831" y="651" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#193744">Values are simulated electrical gain, not physical pressure calibration.</text><text x="45" y="735" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#193744">Pulse flow / isolated bus-voltage observation</text><rect x="45" y="765" width="330" height="140" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="61" y="794" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Field input</text><text x="61" y="824" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Flow: 4.5-5.5 V -&gt; 560 ohm</text><text x="61" y="850" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Bus: 12 V -&gt; 1.8 kohm</text><text x="61" y="876" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">LED + reverse diode</text><polyline points="375,815 465,815" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="465" y="765" width="330" height="140" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="481" y="794" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">Bounded optocoupler</text><text x="481" y="824" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">CTR envelope 0.2 to 2.0</text><text x="481" y="850" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">3.3 V pullup 10k / 1 nF</text><text x="481" y="876" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Model saturation is continuous</text><polyline points="795,815 895,815" fill="none" stroke="#193744" stroke-width="2.5"/><rect x="895" y="765" width="660" height="140" fill="#f0f6f8" stroke="#193744" stroke-width="2"/><text x="911" y="794" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#193744">3.3 V logic input / source identity</text><text x="911" y="824" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Active-low pulses; 500 Hz waveform simulated.</text><text x="911" y="850" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">No pulses can mean zero flow OR a broken signal wire.</text><text x="911" y="876" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#193744">Voltage feedback is supply presence, not valve position.</text><text x="45" y="932" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#193744">Normal 4-20 mA readings must remain within the ADC supply rails; absolute-limit survival alone is not accuracy.</text><text x="45" y="965" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193744">Reverse polarity / open loop / short burden are not classified as valid process measurements.</text><text x="45" y="998" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#a14728">Temperature / I2C wiring, board pullups and GPIO driver backfeed are outside this simulation pack.</text><text x="45" y="1090" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536b76">9 November 2026 | ngspice 47 | All voltages relative to model node 0; Pi header allocation remains unfrozen</text><text x="1440" y="1090" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536b76">3 / 4</text></svg>