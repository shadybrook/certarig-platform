<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect x="0" y="0" width="1600" height="1120" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#203640">Hydraulic layout for the proposed water loop</text><text x="40" y="90" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203640">Room-temperature water; open reservoir; low-head pump. Pressure target, trip and protection setting remain unfrozen.</text><rect x="40" y="108" width="1520" height="46" fill="#fff0d6" stroke="#b47726" stroke-width="2"/><text x="58" y="138" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#94500d">R0 DESIGN REVIEW ONLY - no pin-level build release, ERC/SPICE sign-off or physical validation</text><rect x="40" y="290" width="280" height="300" fill="#eef6f9" stroke="#176a85" stroke-width="2"/><text x="58" y="321" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#176a85">Open reservoir</text><text x="58" y="353" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Vented; no sealed vessel</text><text x="58" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Water-level check</text><text x="58" y="407" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Immersed temperature</text><text x="58" y="434" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Pump inlet kept flooded</text><text x="58" y="461" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Containment tray below</text><rect x="390" y="390" width="250" height="105" fill="#f4f7f8" stroke="#176a85" stroke-width="2"/><text x="408" y="421" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#176a85">Low-head pump</text><text x="408" y="453" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">12 V candidate only</text><text x="408" y="480" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Curve / ports: TBD</text><path d="M 320,442 L 390,442" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="390,442 377.0,436.0 377.0,448.0" fill="#176a85"/><rect x="710" y="390" width="280" height="105" fill="#f4f7f8" stroke="#176a85" stroke-width="2"/><text x="728" y="421" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#176a85">Pressure tee</text><text x="728" y="453" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Transducer + reference</text><text x="728" y="480" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Both need matched ranges</text><path d="M 640,442 L 710,442" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="710,442 697.0,436.0 697.0,448.0" fill="#176a85"/><path d="M 990,442 L 1040,442 L 1040,245 L 1110,245" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="1110,245 1097.0,239.0 1097.0,251.0" fill="#176a85"/><rect x="1110" y="190" width="430" height="110" fill="#f4f7f8" stroke="#176a85" stroke-width="2"/><text x="1128" y="221" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#176a85">Permanent return / bypass</text><text x="1128" y="253" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">No operator isolation in this path</text><text x="1128" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Flow restriction / sizing still to review</text><path d="M 1540,245 L 1570,245 L 1570,880 L 185,880 L 185,590" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="185,590 179.0,603.0 191.0,603.0" fill="#176a85"/><path d="M 1040,442 L 1040,625 L 1110,625" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="1110,625 1097.0,619.0 1097.0,631.0" fill="#176a85"/><rect x="1110" y="570" width="200" height="110" fill="#f4f7f8" stroke="#176a85" stroke-width="2"/><text x="1128" y="601" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#176a85">Flow sensor</text><text x="1128" y="633" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Pulse output</text><text x="1128" y="660" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Test-branch flow</text><rect x="1360" y="570" width="180" height="110" fill="#f4f7f8" stroke="#176a85" stroke-width="2"/><text x="1378" y="601" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#176a85">NC valve</text><text x="1378" y="633" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Zero differential</text><text x="1378" y="660" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Direct acting</text><path d="M 1310,625 L 1360,625" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="1360,625 1347.0,619.0 1347.0,631.0" fill="#176a85"/><path d="M 1540,625 L 1550,625 L 1550,820 L 110,820 L 110,590" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="110,590 104.0,603.0 116.0,603.0" fill="#176a85"/><rect x="710" y="185" width="280" height="140" fill="#fff8ec" stroke="#94500d" stroke-width="2"/><text x="728" y="216" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#94500d">Pressure protection</text><text x="728" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Exact device / setting: TBD</text><text x="728" y="275" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Separate reservoir return</text><text x="728" y="302" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Not the software trip</text><path d="M 990,418 L 1010,418 L 1010,255 L 990,255" fill="none" stroke="#94500d" stroke-width="3"/><polygon points="990,255 1003.0,261.0 1003.0,249.0" fill="#94500d"/><path d="M 850,185 L 850,170 L 350,170 L 350,250 L 245,250 L 245,290" fill="none" stroke="#94500d" stroke-width="3"/><polygon points="245,290 251.0,277.0 239.0,277.0" fill="#94500d"/><text x="40" y="955" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203640">The bypass and protection returns are shown separately. No dead-head or blocked-return trial is authorized.</text><text x="40" y="986" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203640">Flow measures the valve test branch. Pump current, valve current and flow provide different evidence.</text><text x="40" y="1017" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203640">Freeze operating pressure, software trip, protection tolerance and uncertainty below the weakest working rating.</text><text x="40" y="1088" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#516773">CertaRig | 9 November 2026 | Original Phase 3 card and indicator circuit remain preserved</text><text x="1450" y="1088" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#516773">Sheet 2/3</text></svg>