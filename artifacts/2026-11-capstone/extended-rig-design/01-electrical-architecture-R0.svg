<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect x="0" y="0" width="1600" height="1120" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#203640">Electrical architecture for the proposed extension</text><text x="40" y="90" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#203640">Power, command and measured response are separate. Arrows show functional paths, not individual conductors.</text><rect x="40" y="108" width="1520" height="46" fill="#fff0d6" stroke="#b47726" stroke-width="2"/><text x="58" y="138" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#94500d">R0 DESIGN REVIEW ONLY - no pin-level build release, ERC/SPICE sign-off or physical validation</text><rect x="40" y="180" width="250" height="108" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="58" y="211" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Actuator supply</text><text x="58" y="243" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Enclosed low-voltage</text><text x="58" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">12 V: candidate only</text><rect x="360" y="180" width="390" height="108" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="378" y="211" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Fuse + independent cutoff</text><text x="378" y="243" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">DC ratings / fuses not selected</text><text x="378" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Manual reset; release must not restart</text><path d="M 290,234 L 360,234" fill="none" stroke="#203640" stroke-width="3"/><polygon points="360,234 347.0,228.0 347.0,240.0" fill="#203640"/><path d="M 750,234 L 800,234 L 800,226 L 850,226" fill="none" stroke="#203640" stroke-width="3"/><polygon points="850,226 837.0,220.0 837.0,232.0" fill="#203640"/><path d="M 800,234 L 800,381 L 850,381" fill="none" stroke="#203640" stroke-width="3"/><polygon points="850,381 837.0,375.0 837.0,387.0" fill="#203640"/><rect x="850" y="180" width="690" height="100" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="868" y="211" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Pump branch</text><text x="868" y="243" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Branch fuse &gt; current channel I_pump &gt; protected driver &gt; pump</text><text x="868" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Shunt, driver, suppression and start-current rating: TBD</text><rect x="850" y="335" width="690" height="100" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="868" y="366" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Valve branch</text><text x="868" y="398" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Branch fuse &gt; current channel I_valve &gt; protected driver &gt; NC valve</text><text x="868" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Deenergized valve closes; closure time still needs measurement</text><rect x="360" y="335" width="390" height="100" fill="#fff8ec" stroke="#94500d" stroke-width="2"/><text x="378" y="366" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#94500d">E-stop + restart prevention</text><text x="378" y="398" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Hardware cutoff independent of Pi</text><text x="378" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Exact contacts / reset circuit: TBD</text><path d="M 555,335 L 555,288" fill="none" stroke="#94500d" stroke-width="3"/><polygon points="555,288 549.0,301.0 561.0,301.0" fill="#94500d"/><rect x="40" y="510" width="250" height="108" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="58" y="541" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Logic supply</text><text x="58" y="573" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Separate Pi power path</text><text x="58" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Stays on during E-stop</text><rect x="360" y="485" width="390" height="150" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="378" y="516" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Pi + local deterministic control</text><text x="378" y="548" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Separate capstone microSD</text><text x="378" y="575" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Approval, interlocks, recording</text><text x="378" y="602" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Header allocation not frozen</text><path d="M 290,564 L 360,564" fill="none" stroke="#203640" stroke-width="3"/><polygon points="360,564 347.0,558.0 347.0,570.0" fill="#203640"/><path d="M 555,435 L 555,485" fill="none" stroke="#176a85" stroke-width="3" stroke-dasharray="9 7"/><polygon points="555,485 561.0,472.0 549.0,472.0" fill="#176a85"/><text x="570" y="464" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#176a85">E-stop status</text><rect x="850" y="495" width="690" height="140" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="868" y="526" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Protected permit interface</text><text x="868" y="558" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">One reviewed permit enables both protected output branches</text><text x="868" y="585" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Default OFF; physical cutoff always overrides the command</text><text x="868" y="612" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">No pump / valve current through Pi or old indicator circuit</text><path d="M 750,558 L 850,558" fill="none" stroke="#695085" stroke-width="3" stroke-dasharray="9 7"/><polygon points="850,558 837.0,552.0 837.0,564.0" fill="#695085"/><path d="M 1540,555 L 1570,555 L 1570,230 L 1540,230" fill="none" stroke="#695085" stroke-width="3" stroke-dasharray="9 7"/><polygon points="1540,230 1553.0,236.0 1553.0,224.0" fill="#695085"/><path d="M 1570,385 L 1540,385" fill="none" stroke="#695085" stroke-width="3" stroke-dasharray="9 7"/><polygon points="1540,385 1553.0,391.0 1553.0,379.0" fill="#695085"/><rect x="40" y="735" width="440" height="145" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="58" y="766" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Sensors and source identity</text><text x="58" y="798" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Pressure loop: instrument supply TBD</text><text x="58" y="825" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Flow pulse / 1-Wire temperature</text><text x="58" y="852" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">I_pump / I_valve / load-voltage feedback</text><rect x="540" y="735" width="440" height="145" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="558" y="766" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Reviewed acquisition interfaces</text><text x="558" y="798" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">ADC scaling + input fault protection</text><text x="558" y="825" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">3.3 V-compatible digital interfaces</text><text x="558" y="852" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Current/voltage channels stay distinct</text><rect x="1040" y="735" width="500" height="145" fill="#f4f7f8" stroke="#203640" stroke-width="2"/><text x="1058" y="766" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#203640">Pi recording and response checks</text><text x="1058" y="798" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Raw values, calibration, time and quality</text><text x="1058" y="825" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Unknown feedback is not a safe reading</text><text x="1058" y="852" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Current is not mechanical valve position</text><path d="M 480,805 L 540,805" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="540,805 527.0,799.0 527.0,811.0" fill="#176a85"/><path d="M 980,805 L 1040,805" fill="none" stroke="#176a85" stroke-width="3"/><polygon points="1040,805 1027.0,799.0 1027.0,811.0" fill="#176a85"/><text x="40" y="930" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">CHECK FOUND: a 10 V-minimum sensor plus 150 ohm burden needs &gt;=13 V at 20 mA, before cable losses.</text><text x="40" y="959" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">The 150 ohm receiver is an unaccepted example: at 24 mA it develops 3.6 V, beyond a 3.3 V ADC rail.</text><text x="40" y="988" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Grounding/isolation, return conductors, GPIO pins, I2C addresses and component ratings need the final netlist.</text><text x="40" y="1017" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#203640">Black = actuator / logic power; dashed purple = permit; blue = measurement. These are functional connections.</text><text x="40" y="1088" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#516773">CertaRig | 9 November 2026 | Original Phase 3 card and indicator circuit remain preserved</text><text x="1450" y="1088" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#516773">Sheet 1/3</text></svg>