name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check certarig tests
      - name: Type-check
        run: mypy certarig
      - name: Unit, contract, agent, property and scenario tests with coverage gate
        run: |
          pytest tests -q -m "not hil and not live_llm and not slow" \
            --cov=certarig --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Accelerated soak
        run: pytest tests/scenario -q -m slow
      - name: Simulated procedure library (evidence bundles)
        run: |
          python -m certarig sim run-library --out /tmp/certarig-ci-evidence
          ls -R /tmp/certarig-ci-evidence | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install and build marketing site
        run: npm ci && npm run build
      - name: Ideology copy still present
        run: |
          grep -F "kernel may say yes" dist/index.html
          grep -F "A rig is a real setup" dist/index.html
          grep -F "on-switch" dist/index.html
          grep -F 'href="/try"' dist/index.html
          grep -F "small test station" dist/try.html
          grep -F "Bring a real bench" dist/try.html
      - name: Public glass does not leak lab-diary or zero-users
        run: |
          ! grep -F "Paying customers today: zero" dist/index.html dist/try.html
          ! grep -Fi "gpio" dist/index.html dist/try.html
          ! grep -F "ProcessGuardrail" dist/index.html dist/try.html
          ! grep -F "12 Sep" dist/index.html dist/try.html
          ! grep -F "we are not raising" dist/index.html dist/try.html
          ! grep -Fi "no users" dist/index.html dist/try.html
          ! grep -F "github.com/shadybrook/certarig-platform\"" dist/index.html

  studio-e2e:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python package
        run: pip install -e .
      - name: Install Playwright
        working-directory: studio
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Studio end-to-end against the simulator
        working-directory: studio
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: studio/playwright-report
