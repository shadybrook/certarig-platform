<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#176b82"/></marker></defs><rect width="1200" height="830" fill="#f7fafc"/><style>text{font-family:Arial,sans-serif;fill:#152d3a}.small{font-size:14px}</style><text x="35" y="40" font-size="25" font-weight="bold">CR-EXT-R1 | hydraulic connection plan</text><text x="35" y="65" font-size="15">Functional assembly topology. BSPP only; supplier confirms seal faces and port schedule. No energized construction release.</text><rect x="35" y="120" width="190" height="112" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="47" y="144" font-size="17" font-weight="bold">H03 reservoir</text><text x="47" y="167" class="small">5L open / vented</text><text x="47" y="186" class="small">2–3L total inventory</text><text x="47" y="205" class="small">S08 low-level interlock</text><rect x="280" y="120" width="180" height="112" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="292" y="144" font-size="17" font-weight="bold">H01 pump</text><text x="292" y="167" class="small">12V, &lt;=1A steady</text><text x="292" y="186" class="small">Flooded suction</text><text x="292" y="205" class="small">Head &lt;=0.60bar</text><rect x="510" y="120" width="170" height="112" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="522" y="144" font-size="17" font-weight="bold">H06 strainer</text><text x="522" y="167" class="small">100–200um</text><text x="522" y="186" class="small">Low-loss / cleanable</text><text x="522" y="205" class="small">G1/2 F/F</text><rect x="735" y="120" width="210" height="112" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="747" y="144" font-size="17" font-weight="bold">H07 main manifold</text><text x="747" y="167" class="small">6 x G1/2 female</text><text x="747" y="186" class="small">P1 in; P2 bypass</text><text x="747" y="205" class="small">P3 relief; P4 branch</text><polyline points="225,175 280,175" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="230" y="112" class="small">H05 open / 12mm</text><polyline points="460,175 510,175" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><polyline points="680,175 735,175" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><rect x="1000" y="120" width="170" height="135" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="1012" y="144" font-size="17" font-weight="bold">H08 instruments</text><text x="1012" y="167" class="small">4 x G1/4 female</text><text x="1012" y="186" class="small">M01 0–2bar 4–20mA</text><text x="1012" y="205" class="small">S07 NC trip0.25bar</text><text x="1012" y="224" class="small">M04 reference</text><polyline points="945,175 1000,175" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="960" y="163" class="small">P5</text><rect x="735" y="315" width="210" height="112" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="747" y="339" font-size="17" font-weight="bold">H09 relief</text><text x="747" y="362" class="small">Crack0.30+/-0.03bar</text><text x="747" y="381" class="small">10L/min by0.45bar</text><text x="747" y="400" class="small">Independent return</text><polyline points="840,232 840,315" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="850" y="285" class="small">P3</text><polyline points="735,375 195,375 195,232" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="280" y="362" class="small">12mm relief return, unvalved, &lt;=1m</text><polyline points="775,232 775,285 130,285 130,232" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="280" y="274" class="small">P2: permanent unvalved 12mm bypass, &lt;=1m</text><rect x="980" y="315" width="190" height="112" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="992" y="339" font-size="17" font-weight="bold">H10 + H11</text><text x="992" y="362" class="small">Main arrestor0.25L</text><text x="992" y="381" class="small">Vacuum-break + flag</text><text x="992" y="400" class="small">Included accessory tee</text><polyline points="945,215 970,215 970,340 980,340" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="975" y="298" class="small">P6</text><rect x="735" y="490" width="210" height="115" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="747" y="514" font-size="17" font-weight="bold">H12 metering</text><text x="747" y="537" class="small">Lock branch &lt;=1.5L/min</text><text x="747" y="556" class="small">at0.45bar; &lt;=2 at0.60</text><text x="747" y="575" class="small">Total branchI&lt;=7.1e7</text><polyline points="900,232 960,232 960,460 840,460 840,490" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="790" y="451" class="small">P4 / 8mm branch</text><rect x="500" y="490" width="185" height="115" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="512" y="514" font-size="17" font-weight="bold">M02 flow meter</text><text x="512" y="537" class="small">0.1–3L/min</text><text x="512" y="556" class="small">5V NPN + remote EOL</text><text x="512" y="575" class="small">G1/4 F/F</text><polyline points="735,550 685,550" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="490" width="200" height="115" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="262" y="514" font-size="17" font-weight="bold">H13 + local H10</text><text x="262" y="537" class="small">Arrestor tee &lt;=50mm</text><text x="262" y="556" class="small">upstream of H02</text><text x="262" y="575" class="small">0.25L low-head unit</text><polyline points="500,550 450,550" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="490" width="170" height="115" rx="8" fill="#e1eff2" stroke="#50707d"/><text x="47" y="514" font-size="17" font-weight="bold">H02 NC valve</text><text x="47" y="537" class="small">24V; zero differential</text><text x="47" y="556" class="small">50–1000ms closing</text><text x="47" y="575" class="small">CLOSED contact</text><polyline points="250,550 205,550" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><polyline points="120,490 120,415 75,415 75,232" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)"/><text x="150" y="409" class="small">8mm free return retained above reservoir waterline</text><text x="35" y="670" class="small">All wet assemblies over an &gt;=8L effective containment tray. Maximum filled inventory3L.</text><text x="35" y="690" class="small">Normal &lt;=0.12bar; software trip0.15bar; independent switch0.25+/-0.02bar. All structural wet parts rated&gt;=6bar.</text><text x="35" y="710" class="small">Both arrestors: compliance&gt;=0.2mL/kPa at0.05–0.6bar, precharge&lt;=0.02bar; ordinary high-precharge units do not qualify.</text><text x="35" y="730" class="small">Branch total &lt;=2m; main feed &lt;=0.5m; suction &lt;=0.5m; no service valve in either safety return.</text><text x="35" y="750" class="small">M03 water/case probes; S08 low-level float and S09 leak detection are separate monitored channels.</text></svg>