<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#176b82" /></marker></defs><rect width="1200" height="830" fill="#f7fafc" /><style>text{font-family:Arial,sans-serif;fill:#152d3a}.small{font-size:14px}</style><text x="35" y="40" font-size="25" font-weight="bold">CR-EXT-R1 | electrical domains and named connections</text><text x="35" y="65" font-size="15">Module/interface schematic. Internal supplier schematics, pin-level design and factory tests are required for S01/S02/S03.</text><rect x="35" y="110" width="210" height="120" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="47" y="134" font-size="17" font-weight="bold">P01 / P02 supplies</text><text x="47" y="157" class="small">12 V / 5 A; 24 V / 2.5 A</text><text x="47" y="176" class="small">Factory enclosed SELV</text><text x="47" y="195" class="small">Covered DC fuses</text><rect x="305" y="110" width="210" height="120" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="317" y="134" font-size="17" font-weight="bold">S02 cutoffs</text><text x="317" y="157" class="small">K1 then K2 in series</text><text x="317" y="176" class="small">Both positive rails</text><text x="317" y="195" class="small">EDM mirror feedback</text><rect x="575" y="110" width="245" height="120" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="587" y="134" font-size="17" font-weight="bold">S01 protection + command</text><text x="587" y="157" class="small">Latched current/power limit</text><text x="587" y="176" class="small">Softstart / output discharge</text><text x="587" y="195" class="small">Pump 12 V; valve 24 V clamps</text><rect x="885" y="110" width="270" height="120" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="897" y="134" font-size="17" font-weight="bold">Measured loads</text><text x="897" y="157" class="small">H01 pump / H02 NC valve</text><text x="897" y="176" class="small">Hall current in load conductor</text><text x="897" y="195" class="small">Differential V across load</text><polyline points="245,170 305,170" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><text x="248" y="98" class="small">Fused12V +24V</text><polyline points="515,170 575,170" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><polyline points="820,170 885,170" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><rect x="305" y="320" width="260" height="140" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="317" y="344" font-size="17" font-weight="bold">S02 independent inputs</text><text x="317" y="367" class="small">E-stop2NC; STOP; edge RESET</text><text x="317" y="386" class="small">Pressure / low level / leak</text><text x="317" y="405" class="small">Thermal / vacuum / field power</text><text x="317" y="424" class="small">Hardware 10 Hz watchdog</text><polyline points="410,320 410,230" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><text x="420" y="250" class="small">Hardware authority</text><rect x="675" y="320" width="300" height="140" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="687" y="344" font-size="17" font-weight="bold">S03 field acquisition</text><text x="687" y="367" class="small">Pressure loop 24 V / 100 ohm</text><text x="687" y="386" class="small">2 x ADC + 2 isolated Hall channels</text><text x="687" y="405" class="small">Protected differential voltage inputs</text><text x="687" y="424" class="small">Supervised pulse counter0x42</text><polyline points="1020,230 1020,300 900,300 900,320" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><text x="910" y="275" class="small">Measured signals / CLOSED contact</text><polyline points="155,230 155,285 735,285 735,320" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><text x="35" y="308" class="small">Permanent 24 V instrument branch</text><rect x="35" y="550" width="300" height="140" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="47" y="574" font-size="17" font-weight="bold">Pi / host 3.3 V</text><text x="47" y="597" class="small">Separate official 5 V supply</text><text x="47" y="616" class="small">Development microSD / recorder</text><text x="47" y="635" class="small">I2C100kHz / 1-Wire probes</text><text x="47" y="654" class="small">No field-ground tie at host</text><rect x="430" y="550" width="300" height="140" rx="8" fill="#e1eff2" stroke="#50707d" /><text x="442" y="574" font-size="17" font-weight="bold">Isolation boundary</text><text x="442" y="597" class="small">I2C host3.3V -&gt; field5V</text><text x="442" y="616" class="small">Optoisolated permit / heartbeat</text><text x="442" y="635" class="small">Isolated health / EDM / CLOSED</text><text x="442" y="654" class="small">No 24 V or 5 V on Pi GPIO</text><polyline points="335,610 430,610" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><polyline points="730,610 825,610 825,460" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" /><text x="840" y="545" class="small">Read-only acquisition</text><polyline points="550,550 550,490 450,490 450,460" fill="none" stroke="#176b82" stroke-width="3" marker-end="url(#a)" stroke-dasharray="6 4" /><text x="65" y="505" class="small">Permit / heartbeat + isolated status</text><text x="35" y="745" class="small">Sequence: reset/arm with permit LOW -&gt; wait up to1.1s for S01 READY -&gt; fresh reviewed execution permit.</text><text x="35" y="765" class="small">Early/held permit must not start when READY appears. Any trip removes authority; recovery needs reset and new approval.</text><text x="35" y="785" class="small">Cutoff removes actuator power while Pi and instrument acquisition stay powered. This topology does not assert SIL/PL certification.</text></svg>