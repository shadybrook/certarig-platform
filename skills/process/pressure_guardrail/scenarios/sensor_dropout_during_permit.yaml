name: pressure sensor dropout while permitted
description: The pressure channel disappears while the output is energised. The kernel must drop the output and the run must not pass.
seed: 12
procedure: pressure_guardrail
duration_s: 60
events:
  - at_step: raise_pressure
    action: fault
    kind: dropout
    channel: pressure
expect:
  outcome: failed
  kernel_events_include: [permit_accepted, sensor_invalid_forced_safe]
  kernel_events_exclude: [pressure_high_forced_safe]
  final_output_high: false
  invariants: [output_off_when_estop, output_off_when_process_unsafe, no_restart_without_reset, ends_safe]
