name: flow dropout after the pressure trip
description: P1 trip succeeds; P2 disappears when the operator should raise flow. Run must fail safe.
seed: 32
procedure: dual_pot_guardrail
duration_s: 120
events:
  - at_step: raise_pressure
    action: ramp
    channel: pressure
    to: 5.2
    over_s: 1.2
  - at_step: lower_pressure
    action: ramp
    channel: pressure
    to: 2.0
    over_s: 0.8
  - at_step: raise_flow
    action: fault
    kind: dropout
    channel: flow
expect:
  outcome: failed
  kernel_events_include: [permit_accepted, pressure_high_forced_safe, sensor_invalid_forced_safe]
  kernel_events_exclude: [flow_high_forced_safe]
  final_output_high: false
  invariants: [output_off_when_estop, output_off_when_process_unsafe, no_restart_without_reset, ends_safe]
