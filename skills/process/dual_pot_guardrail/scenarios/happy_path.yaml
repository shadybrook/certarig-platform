name: dual pot guardrail happy path
description: P1 trips first, reset and re-permit, then P2 trips. Both force safe independently.
seed: 31
procedure: dual_pot_guardrail
label: sim-dual-pot
duration_s: 180
events:
  - at_step: raise_pressure
    action: ramp
    channel: pressure
    to: 5.2
    over_s: 1.5
  - at_step: lower_pressure
    action: ramp
    channel: pressure
    to: 2.0
    over_s: 1.0
  - at_step: raise_flow
    action: ramp
    channel: flow
    to: 16.5
    over_s: 1.5
  - at_step: lower_flow
    action: ramp
    channel: flow
    to: 8.0
    over_s: 1.0
expect:
  outcome: passed
  kernel_events_include:
    - permit_accepted
    - pressure_high_forced_safe
    - flow_high_forced_safe
    - permit_rejected_reset_required
  kernel_events_exclude: [estop_open_forced_safe, sensor_invalid_forced_safe]
  final_output_high: false
  invariants: [output_off_when_estop, output_off_when_process_unsafe, no_restart_without_reset, csv_rows_contiguous, ends_safe]
  min_csv_rows: 50
