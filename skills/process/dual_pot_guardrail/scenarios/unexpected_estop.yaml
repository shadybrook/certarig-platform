name: unexpected e-stop during dual pot test
description: E-stop during the first permitted hold. Run aborts; output off.
seed: 34
procedure: dual_pot_guardrail
duration_s: 60
events:
  - at_step: stable_permit
    action: estop
    pressed: true
    delay_s: 0.3
expect:
  outcome: aborted
  outcome_reason_contains: emergency stop
  kernel_events_include: [estop_open_forced_safe]
  final_output_high: false
  invariants: [output_off_when_estop, output_off_when_process_unsafe, no_restart_without_reset, ends_safe]
