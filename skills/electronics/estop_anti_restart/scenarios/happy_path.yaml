name: estop anti-restart happy path
seed: 21
procedure: estop_anti_restart
duration_s: 60
events:
  - at_step: press_estop
    action: estop
    pressed: true
    delay_s: 0.4
  - at_step: release_estop
    action: estop
    pressed: false
    delay_s: 0.4
expect:
  outcome: passed
  kernel_events_include: [permit_accepted, estop_open_forced_safe, estop_closed_reset_required, permit_rejected_reset_required]
  final_output_high: false
  invariants: [output_off_when_estop, output_off_when_process_unsafe, no_restart_without_reset, csv_rows_contiguous, ends_safe]
