name: relay driver failure
description: set_valve fails from the first hold onwards. The runtime must fail safe and the run must fail.
seed: 32
procedure: relay_truth_table
duration_s: 60
events:
  - at_step: cycle1_hold
    action: fault
    kind: driver_failure
expect:
  outcome: failed
  steps_failed: [cycle2_permit]
  kernel_events_include: [output_driver_error_forced_safe]
  final_output_high: false
  invariants: [output_off_when_estop, output_off_when_process_unsafe, no_restart_without_reset, ends_safe]
