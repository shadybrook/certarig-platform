[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certarig"
version = "0.4.0"
description = "CertaRig: agentic test-operations platform with a deterministic safety kernel, procedure runtime, rig simulator and evidence engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chintan Dedhia" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
pi = [
  "gpiozero>=2.0.1,<3",
  "smbus2>=0.4.3,<1",
]
anthropic = ["anthropic>=0.40,<1"]
openai = ["openai>=1.68,<3"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
certarig = "certarig.cli:main"

[tool.setuptools.packages.find]
include = ["certarig*"]

[tool.setuptools.package-data]
certarig = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "hil: hardware-in-the-loop tests that need the real Raspberry Pi bench",
  "live_llm: tests that call a real LLM provider (opt-in, need an API key)",
  "slow: long-running soak or property tests",
]

[tool.coverage.run]
branch = true
source = ["certarig"]
omit = [
  "certarig/edge/hardware/raspberry_pi.py",
  "certarig/__main__.py",
  "certarig/cli.py",
  "certarig/agent/providers/anthropic_provider.py",
  "certarig/agent/providers/openai_provider.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unreachable = true
strict_equality = true
